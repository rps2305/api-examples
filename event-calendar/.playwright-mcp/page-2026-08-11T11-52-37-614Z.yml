  - main [ref=f4e26]:
    - region [ref=f4e27]:
      - generic [ref=f4e28]:
        - paragraph [ref=f4e29]: VAN PERSOONLIJKE VRAAG NAAR DAGELIJKSE TOOL
        - heading "Niet dubbel boeken, wel alles zien." [level=2] [ref=f4e30]
        - paragraph [ref=f4e31]: "Uit Vandaag begon als een praktische oplossing voor een herkenbaar probleem: concerten, lokale evenementen en FC Twente-wedstrijden stonden verspreid over verschillende agenda’s. De eerste versie bracht die informatie samen voor Ronald Punt. Daarna kwam er bijna dagelijks iets bij, telkens vanuit een concrete vraag die tijdens het gebruik ontstond."
      - generic [ref=f4e32]:
        - generic [ref=f4e33]:
          - term [ref=f4e34]: Start
          - definition [ref=f4e35]: 31 juli 2026, als persoonlijke Twentse uitagenda.
        - generic [ref=f4e36]:
          - term [ref=f4e37]: Ritme
          - definition [ref=f4e38]: Automatische vernieuwing iedere zes uur, plus een wekelijkse e-maildigest.
        - generic [ref=f4e39]:
          - term [ref=f4e40]: Bereik
          - definition [ref=f4e41]: Concerten, cultuur, lokale evenementen, feestdagen en FC Twente in één tijdlijn.
        - generic [ref=f4e42]:
          - term [ref=f4e43]: Principe
          - definition [ref=f4e44]: Bronnen blijven leidend. Deze app helpt kiezen en plannen, niet gokken.
    - region [ref=f4e45]:
      - paragraph [ref=f4e46]: KORTE GESCHIEDENIS
      - heading "Elke gebruiksdag leverde een volgend detail op" [level=2] [ref=f4e47]
      - paragraph [ref=f4e48]: De eerste bouw bracht de evenementenbronnen, de agendaweergave en de iCalendar-download samen. Kort daarna kwamen betere filtering, een suggestieformulier, privacy-instellingen en een progressieve agenda die niet alles in één keer hoeft te laden.
      - paragraph [ref=f4e49]: "Daarna werd de app steeds persoonlijker én robuuster: muzieksmaaktips uit een lokale bibliotheek, ticketlinks, een mobiele scrollervaring, maand- en jaarselectie, een Nederlandstalige e-maildigest en duidelijke podiumkleuren voor Metropool, De Cactus, Oogst en FC Twente."
      - paragraph [ref=f4e50]:
        - text: "Op 9 augustus 2026 kwam een praktische gebruikslaag erbij: deelbare filters in de URL, duidelijke agenda-acties voor één evenement en voor de volledige feed, een privacyverklaring, een pauzeknop voor de locatiecarrousel en een skiplink. Ook zijn de datums en tijden expliciet op"
        - code [ref=f4e51]: Europe/Amsterdam
        - text: afgestemd; importeurs bewaren echte UTC-tijden en behandelen bron-tijden niet stilzwijgend als UTC.
      - heading "De technische opbouw" [level=2] [ref=f4e52]
      - list [ref=f4e53]:
        - listitem [ref=f4e54]:
          - strong [ref=f4e55]: Python 3.12
          - text: verzamelt, normaliseert en dedupliceert de evenementgegevens, bouwt de iCalendar-feed en verstuurt de digest.
        - listitem [ref=f4e56]:
          - strong [ref=f4e57]: Standaard HTML, CSS en JavaScript
          - text: vormen de snelle, frameworkvrije interface. De agenda is vooraf gerenderd voor vindbaarheid en wordt daarna interactief gefilterd in de browser; zoekopdrachten en filters blijven deelbaar via de URL.
        - listitem [ref=f4e58]:
          - strong [ref=f4e59]: Bronspecifieke scrapers
          - text: lezen openbare informatie van Metropool, De Cactus, Oogst, Uit in Hengelo, officiële feestdagen en FC Twente. Onbetrouwbare of tijdelijk onbereikbare bronnen breken de laatst bekende agenda niet.
        - listitem [ref=f4e60]:
          - strong [ref=f4e61]: JSON en iCalendar
          - text: "zijn de twee uitgangen: de browser gebruikt de ingebedde JSON-feed, agenda-apps kunnen zich abonneren via"
          - link "events.ics" [ref=f4e62] [cursor=pointer]:
            - /url: events.ics
          - text: . De feed wordt als
          - code [ref=f4e63]: text/calendar; charset=utf-8
          - text: geleverd, met ETag en korte conditionele cache.
        - listitem [ref=f4e64]:
          - strong [ref=f4e65]: Docker Compose
          - text: verpakt de app. Nginx behandelt publiek HTTPS-verkeer; de Python-service luistert alleen lokaal op de host.
        - listitem [ref=f4e66]:
          - strong [ref=f4e67]: Cache en compressie
          - text: "houden de site licht: versiegebonden assets zijn langdurig immutable gecachet, HTML wordt kort gecachet met revalidatie, en de publieke proxy levert Brotli waar de browser dat ondersteunt."
        - listitem [ref=f4e68]:
          - strong [ref=f4e69]: SMTP via Gmail
          - text: verzorgt de digest. Het wachtwoord komt uit een omgevingsvariabele in productie of uit de macOS-sleutelhanger lokaal, nooit uit de broncode.
      - generic "Gebruikte techniek" [ref=f4e70]:
        - link "Docker" [ref=f4e71] [cursor=pointer]:
          - /url: https://www.docker.com/
        - link "Oracle Cloud" [ref=f4e73] [cursor=pointer]:
          - /url: https://www.oracle.com/cloud/
          - generic [ref=f4e74]: ORCL
        - link "OpenAI Codex" [ref=f4e76] [cursor=pointer]:
          - /url: https://openai.com/codex/
          - generic [ref=f4e77]: ◌
        - link "Python" [ref=f4e79] [cursor=pointer]:
          - /url: https://www.python.org/
      - heading "Veiligheid en betrouwbaarheid" [level=2] [ref=f4e81]
      - paragraph [ref=f4e82]: Externe links worden beperkt tot HTTP(S), gescrapete tekst wordt als tekst gerenderd en de server stuurt onder meer CSP-, HSTS-, anti-framing- en no-sniff-headers. Het suggestieformulier valideert invoer, origin, tokens en aantallen. De verzendwebhook vereist een Bearer-token. De container draait als een eigen, niet-rootgebruiker.
      - paragraph [ref=f4e83]: Een kleine persoonlijke app hoeft niet zwaar te voelen. Wel moet hij veilig genoeg zijn om elke dag zonder gedoe zijn werk te doen.
      - heading "Controle op 9 augustus 2026" [level=2] [ref=f4e84]
      - paragraph [ref=f4e85]: "Na de productie-uitrol is de publieke homepage getest met Lighthouse op een mobiel profiel: performance 99, toegankelijkheid 100, best practices 100 en SEO 100. SEOmator beoordeelde de technische basis en core SEO beide met 100; de totaalscore was 97 door optimalisatiekansen rond de grote vooraf gerenderde agenda, DOM-omvang en LCP-hints. De pagina is daarnaast geopend in Chrome op een Pixel 9-emulator met Android API 35."
      - heading "Hulp bij het bouwen" [level=2] [ref=f4e86]
      - paragraph [ref=f4e87]:
        - text: Deze app is gebouwd en doorontwikkeld door Ronald Punt, met hulp van
        - strong [ref=f4e88]: OpenAI Codex 5.6
        - text: . Voor de interfaceontwikkeling is ook gebruikgemaakt van de open-source
        - link "Impeccable-designguidance van Paul Bakus ↗" [ref=f4e89] [cursor=pointer]:
          - /url: https://github.com/pbakaus/impeccable
        - text: . De keuzes over inhoud, functionaliteit en publicatie blijven bij Ronald.
      - heading "Dit document blijft meebewegen" [level=2] [ref=f4e90]
      - paragraph [ref=f4e91]: Bij elke wezenlijke wijziging aan functies, architectuur, databronnen, e-mail, deployment of beveiliging wordt deze pagina bijgewerkt. Zo blijft niet alleen de agenda actueel, maar ook het verhaal achter de techniek.
    - region [ref=f4e92]:
      - paragraph [ref=f4e93]: VERSIEGESCHIEDENIS
      - heading "Wat er veranderde" [level=2] [ref=f4e94]
      - list [ref=f4e95]:
        - listitem [ref=f4e96]:
          - time [ref=f4e97]: 9 augustus 2026
          - generic [ref=f4e98]:
            - heading "Betere planning, toegankelijkheid en prestaties" [level=3] [ref=f4e99]
            - paragraph [ref=f4e100]: Filters zijn deelbaar via de URL, de volledige iCalendar-feed kreeg duidelijke download- en abonnementsacties, en tijden worden consequent in de tijdzone van Amsterdam getoond. Er kwamen een privacyverklaring, skiplink en een pauzeknop voor de locatiecarrousel. Assets en HTML kregen passende cacheheaders en ETags; de ICS-feed gebruikt nu het juiste kalender-contenttype. De publieke site is gecontroleerd met Lighthouse, SEOmator en Chrome op Android.
        - listitem [ref=f4e101]:
          - time [ref=f4e102]: 7 augustus 2026
          - generic [ref=f4e103]:
            - heading "Muzieksmaak, leesbaarheid en navigatie" [level=3] [ref=f4e104]
            - paragraph [ref=f4e105]: De muzieksmaak is aangevuld met Live, Rage Against the Machine, Moloko, Faithless en klassieke rockacts. 074 is gecorrigeerd naar de voormalige Hengelose discotheek, niet een band. Actie- en deelknoppen kregen betere contrasten op gekleurde agenda-items. Ook is een toegankelijke hoofdmenu-knop toegevoegd. Duitse schlagers zijn als expliciete uitzondering toegevoegd vanwege het vierde Oktoberfest-bezoek in München. De overbodige teruglink is verwijderd nu het hoofdmenu overal beschikbaar is.
        - listitem [ref=f4e106]:
          - time [ref=f4e107]: 6 augustus 2026
          - generic [ref=f4e108]:
            - heading "Persoonlijke context en vindbaarheid" [level=3] [ref=f4e109]
            - paragraph [ref=f4e110]: De pagina Muzieksmaak kreeg een duidelijke toelichting op de concerttips. De agenda werd vooraf gerenderd voor betere vindbaarheid, terwijl filters en persoonlijke aanbevelingen interactief bleven.
        - listitem [ref=f4e111]:
          - time [ref=f4e112]: 4 augustus 2026
          - generic [ref=f4e113]:
            - heading "Betere service en robuustere verwerking" [level=3] [ref=f4e114]
            - paragraph [ref=f4e115]: De wekelijkse digest, suggesties en foutafhandeling zijn aangescherpt. De agenda behoudt bij tijdelijke bronproblemen de laatst bekende, bruikbare gegevens.
        - listitem [ref=f4e116]:
          - time [ref=f4e117]: 2 augustus 2026
          - generic [ref=f4e118]:
            - heading "Privacy en vertrouwen" [level=3] [ref=f4e119]
            - paragraph [ref=f4e120]: Privacy-instellingen, toestemming voor statistieken, disclaimer, beveiligingsinformatie en toegankelijke hulpteksten zijn toegevoegd. Daarmee werd de persoonlijke agenda ook transparanter in gebruik.
        - listitem [ref=f4e121]:
          - time [ref=f4e122]: 1 augustus 2026
          - generic [ref=f4e123]:
            - heading "Plannen en personaliseren" [level=3] [ref=f4e124]
            - paragraph [ref=f4e125]: Zoeken, datum- en maandfilters, iCalendar-downloads, thema-voorkeuren en de mobiele agendaweergave maakten de eerste versie praktischer voor dagelijks gebruik.
        - listitem [ref=f4e126]:
          - time [ref=f4e127]: 31 juli 2026
          - generic [ref=f4e128]:
            - heading "De eerste agenda" [level=3] [ref=f4e129]
            - paragraph [ref=f4e130]: Uit Vandaag Twente ging van start als persoonlijke agenda voor concerten, lokale evenementen, feestdagen en FC Twente. Bronnen werden samengebracht in één tijdlijn, met een iCalendar-feed om afspraken niet dubbel te plannen.
