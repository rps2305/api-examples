    - heading "Webscraping en juistheid" [level=2] [ref=f3e55]
    - paragraph [ref=f3e56]: Deze website gebruikt webscraping om openbare agenda-informatie te verzamelen. Gegevens kunnen onvolledig, vertraagd of gewijzigd zijn. Uit Vandaag Twente geeft geen garantie op de juistheid, volledigheid of beschikbaarheid van de informatie en is niet verantwoordelijk voor wijzigingen, afgelaste evenementen, ticketverkoop of externe websites.
    - heading "Privacy en Matomo" [level=2] [ref=f3e57]
    - paragraph [ref=f3e58]:
      - text: Uit Vandaag Twente gebruikt de zelf beheerde Matomo-installatie op
      - link "matomo.puntuale.nl" [ref=f3e59] [cursor=pointer]:
        - /url: https://matomo.puntuale.nl/
      - text: (site-ID 15) om te begrijpen welke pagina’s en links worden gebruikt. Matomo wordt pas geladen nadat een bezoeker daar uitdrukkelijk toestemming voor geeft. Zonder toestemming gaan er geen analyticsgegevens naar Matomo en worden er geen analytische cookies geplaatst.
    - paragraph [ref=f3e60]: Na toestemming verwerkt Matomo onder meer de bezochte pagina, het tijdstip, de verwijzende pagina en technische browser- en apparaatgegevens. De server ontvangt daarbij ook het IP-adres dat nodig is om de verbinding af te handelen. Er worden geen advertentienetwerken, gebruikers-ID’s, heatmaps of sessie-opnamen gebruikt.
    - paragraph [ref=f3e61]:
      - text: Matomo kan first-party cookies plaatsen, waaronder
      - code [ref=f3e62]: _pk_id
      - text: voor het herkennen van een terugkerend bezoek (standaard maximaal 13 maanden),
      - code [ref=f3e63]: _pk_ses
      - text: voor de huidige sessie (standaard 30 minuten) en
      - code [ref=f3e64]: _pk_ref
      - text: voor herkomstinformatie (standaard maximaal 6 maanden). De keuze zelf wordt als noodzakelijke privacyvoorkeur in de lokale browseropslag bewaard.
    - paragraph [ref=f3e65]:
      - text: Toestemming is vrijwillig en kan altijd worden gewijzigd via
      - button "Privacy-instellingen" [ref=f3e66] [cursor=pointer]
      - text: . Bij intrekken worden bekende Matomo-cookies verwijderd en wordt Matomo bij volgende bezoeken niet geladen. Gebruik voor vragen of een privacyverzoek de
      - link "ideeënbus" [ref=f3e67] [cursor=pointer]:
        - /url: index.html#suggestion-title
      - text: .
    - heading "AI" [level=2] [ref=f3e68]
    - paragraph [ref=f3e69]: Deze website is ontwikkeld met hulp van AI, waaronder OpenAI Codex. AI is gebruikt als hulpmiddel bij ontwerp en ontwikkeling; de agenda-informatie zelf komt uit de hierboven genoemde openbare bronnen.
    - heading "Persoonlijk en onafhankelijk" [level=2] [ref=f3e70]
    - paragraph [ref=f3e71]: "Ronald Punt is al jarenlang vrijwilliger bij Metropool, BAM! Festival en Oogst. Hij maakt deze agenda op persoonlijke titel: de website is geen officiële publicatie van, wordt niet gesponsord door en spreekt niet namens deze of andere genoemde organisaties. Merknamen en logo’s blijven eigendom van hun respectieve rechthebbenden en worden uitsluitend gebruikt ter bronvermelding."
    - heading "Gebruik op eigen risico" [level=2] [ref=f3e72]
    - paragraph [ref=f3e73]: Gebruik deze agenda als inspiratie en controleer altijd de originele evenementpagina. Door de website te gebruiken, doe je dat op eigen risico.
