  - main [ref=f3e26]:
    - paragraph [ref=f3e27]: Uit Vandaag Twente is een persoonlijke, onafhankelijke planningsagenda. Ronald Punt gebruikt hem om favoriete concerten, evenementen en FC Twente-wedstrijden naast elkaar te zien — en zo niet per ongeluk twee afspraken op hetzelfde moment te maken. Vrienden en kennissen mogen de agenda gebruiken als zij hem handig vinden.
    - heading "Redactionele scope" [level=2] [ref=f3e28]
    - paragraph [ref=f3e29]: De selectie richt zich op Ronalds favoriete plekken in Hengelo, Almelo en Enschede en op wedstrijden van FC Twente. Het is bewust geen compleet overzicht van alle theaters, bioscopen, festivals en podia in Twente.
    - paragraph [ref=f3e30]:
      - text: Evenementen van
      - link "bamfestival.nl" [ref=f3e31] [cursor=pointer]:
        - /url: https://bamfestival.nl/
      - text: zijn nog niet opgenomen en worden later toegevoegd.
    - paragraph [ref=f3e32]:
      - text: Metropool, De Cactus, Oogst, FC Twente en Uit in Hengelo worden bij het starten en daarna iedere zes uur opgehaald. Evenementen met dezelfde genormaliseerde naam en aanvang worden samengevoegd; een bekende locatie helpt om dezelfde gebeurtenis ook bij kleine tijdverschillen te herkennen.
      - generic [ref=f3e33]: "Laatste succesvolle verwerking van alle bronnen: dinsdag 11 augustus 2026 om 14:38."
    - heading "Bronnen en tickets" [level=2] [ref=f3e34]
    - paragraph [ref=f3e35]: De agenda verzamelt publiek beschikbare informatie van onderstaande organisaties. Controleer voor tijden, beschikbaarheid, toegang en tickets altijd de oorspronkelijke aanbieder.
