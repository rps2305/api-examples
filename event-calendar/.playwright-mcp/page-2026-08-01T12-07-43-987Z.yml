    - heading "Webscraping en juistheid" [level=2] [ref=f3e34]
    - paragraph [ref=f3e35]: Deze website gebruikt webscraping om openbare agenda-informatie te verzamelen. Gegevens kunnen onvolledig, vertraagd of gewijzigd zijn. Uit Vandaag Twente geeft geen garantie op de juistheid, volledigheid of beschikbaarheid van de informatie en is niet verantwoordelijk voor wijzigingen, afgelaste evenementen, ticketverkoop of externe websites.
    - heading "AI" [level=2] [ref=f3e36]
    - paragraph [ref=f3e37]: Deze website is ontwikkeld met hulp van AI, waaronder OpenAI Codex. AI is gebruikt als hulpmiddel bij ontwerp en ontwikkeling; de agenda-informatie zelf komt uit de hierboven genoemde openbare bronnen.
    - heading "Geen verbondenheid" [level=2] [ref=f3e38]
    - paragraph [ref=f3e39]: Uit Vandaag Twente is niet verbonden aan, gesponsord door of namens Metropool, De Cactus, FC Twente, Ticketmaster of andere genoemde organisaties. Merknamen en logo’s blijven eigendom van hun respectieve rechthebbenden en worden uitsluitend gebruikt ter bronvermelding.
    - heading "Gebruik op eigen risico" [level=2] [ref=f3e40]
    - paragraph [ref=f3e41]: Gebruik deze agenda als inspiratie en controleer altijd de originele evenementpagina. Door de website te gebruiken, doe je dat op eigen risico.
